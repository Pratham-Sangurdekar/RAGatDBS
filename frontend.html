<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Assistant (RAG)</title>
    <!-- Tailwind CSS for styling without build steps -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .chat-scroll { scroll-behavior: smooth; }
        .source-tag { transition: all 0.2s ease; }
        .source-tag:hover { transform: translateY(-1px); }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">
                AI
            </div>
            <div>
                <h1 class="text-lg font-semibold text-gray-900">Knowledge Assistant</h1>
                <p class="text-xs text-gray-500">RAG-powered contextual search</p>
            </div>
        </div>
        <button id="clearBtn" class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded" title="Clear Chat">
            <i class="fas fa-trash-alt"></i>
        </button>
    </header>

    <!-- Chat Container -->
    <main id="chatWindow" class="flex-1 overflow-y-auto p-6 space-y-6 chat-scroll">
        <!-- Empty State -->
        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center p-4">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 mb-4 text-2xl">
                <i class="fas fa-comments"></i>
            </div>
            <h2 class="text-xl font-medium text-gray-700 mb-2">How can I help you today?</h2>
            <p class="text-gray-500 max-w-sm">Ask questions about your data, and I'll retrieve the exact sources to give you accurate answers.</p>
        </div>

        <!-- Chat messages will be injected here via JS -->
    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t border-gray-200 p-4">
        <div class="max-w-4xl mx-auto flex items-end space-x-3 bg-white border border-gray-300 rounded-xl p-2 shadow-sm focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-200">
            <textarea id="queryInput" rows="1" placeholder="Ask a question..." 
                class="flex-1 resize-none border-0 bg-transparent focus:ring-0 focus:outline-none text-gray-700 max-h-32 p-2"
                style="height: 40px;"></textarea>
            <button id="sendBtn" class="bg-indigo-600 text-white rounded-lg w-10 h-10 flex items-center justify-center hover:bg-indigo-700 transition-colors shadow-sm">
                <i class="fas fa-paper-plane text-sm"></i>
            </button>
        </div>
        <p class="text-center text-xs text-gray-400 mt-2">AI can make mistakes. Verify important claims.</p>
    </footer>

    <!-- JavaScript for Functionality -->
    <script>
        const chatWindow = document.getElementById('chatWindow');
        const emptyState = document.getElementById('emptyState');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Replace this with your actual FastAPI / LangGraph / Streaming endpoint URL
        const API_URL = 'http://localhost:8000/api/chat'; 

        // Auto-resize textarea
        queryInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Enter key to submit
        queryInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        sendBtn.addEventListener('click', handleSend);

        clearBtn.addEventListener('click', () => {
            chatWindow.innerHTML = '';
            chatWindow.appendChild(emptyState);
            queryInput.style.height = '40px';
        });

        async function handleSend() {
            const query = queryInput.value.trim();
            if (!query) return;

            // Remove empty state
            if (emptyState && emptyState.parentNode) {
                emptyState.remove();
            }

            // 1. Append User Message
            appendMessage(query, 'user');
            queryInput.value = '';
            queryInput.style.height = '40px';

            // 2. Create Placeholder for AI Message
            const aiMessageDiv = appendMessage('', 'ai');
            const messageBody = aiMessageDiv.querySelector('.message-body');
            const sourcesContainer = aiMessageDiv.querySelector('.sources-container');

            try {
                // 3. Connect to API (SSE / WebSocket is ideal, but using Fetch here for simplicity)
                // For a robust stream, adapt this to use fetch with ReadableStream or EventSource
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                // Simulate Streaming (Or process actual backend stream)
                // Example parses a JSON response: { "answer": "...", "sources": [...] }
                const data = await response.json();
                typeOutText(messageBody, data.answer || "No response received.");
                
                if (data.sources && data.sources.length > 0) {
                    renderSources(sourcesContainer, data.sources);
                }

            } catch (error) {
                messageBody.innerHTML = `<span class="text-red-500"><i class="fas fa-exclamation-circle mr-1"></i> Error: Failed to connect to RAG backend.</span>`;
            }
        }

        function appendMessage(text, sender) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-6 animate-fade-in`;

            const isUser = sender === 'user';
            
            messageWrapper.innerHTML = `
                <div class="flex max-w-2xl ${isUser ? 'flex-row-reverse' : 'flex-row'} items-start space-x-2 space-x-reverse">
                    <!-- Avatar -->
                    <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 text-xs ${
                        isUser ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-600'
                    }">
                        <i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i>
                    </div>
                    <!-- Content -->
                    <div class="flex flex-col space-y-1">
                        <div class="message-body px-4 py-3 rounded-2xl text-sm leading-relaxed ${
                            isUser ? 'bg-indigo-600 text-white rounded-br-none shadow-sm' : 'bg-white text-gray-800 rounded-bl-none border border-gray-200 shadow-sm'
                        }">
                            ${text ? text.replace(/\n/g, '<br>') : `<span class="flex items-center space-x-1"><span class="animate-pulse">.</span><span class="animate-pulse delay-75">.</span><span class="animate-pulse delay-150">.</span></span>`}
                        </div>
                        <!-- Sources (Only for AI) -->
                        ${!isUser ? '<div class="sources-container flex flex-wrap gap-2 mt-1"></div>' : ''}
                    </div>
                </div>
            `;

            chatWindow.appendChild(messageWrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return messageWrapper;
        }

        function typeOutText(element, text, speed = 15) {
            let i = 0;
            element.innerHTML = '';
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        function renderSources(container, sources) {
            container.innerHTML = `
                <details class="w-full mt-2">
                    <summary class="text-xs text-indigo-600 font-medium cursor-pointer hover:underline select-none">
                        View Retrieved Sources (${sources.length})
                    </summary>
                    <div class="mt-2 bg-gray-50 border border-gray-200 rounded-lg p-3 text-xs text-gray-600 space-y-2 max-h-40 overflow-y-auto">
                        ${sources.map(src => `
                            <div class="p-2 bg-white rounded border border-gray-100 shadow-sm">
                                <div class="flex items-center justify-between font-semibold text-gray-700 mb-1">
                                    <span><i class="fas fa-file-alt mr-1"></i> ${src.title || 'Document'}</span>
                                    <span class="text-gray-400 font-normal">Score: ${src.score ? (src.score * 100).toFixed(0) + '%' : 'N/A'}</span>
                                </div>
                                <p class="text-gray-500 italic">"${src.snippet || src.content || 'No snippet available'}"</p>
                            </div>
                        `).join('')}
                    </div>
                </details>
            `;
        }
    </script>
</body>
